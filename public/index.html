<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wxnote - 个人备忘录后端服务</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 2.5rem; max-width: 480px; width: 90%; }
        h1 { color: #60a5fa; margin: 0 0 0.5rem 0; font-size: 1.5rem; }
        p { color: #94a3b8; margin: 0.5rem 0; line-height: 1.6; }
        code { background: #0f172a; padding: 0.2rem 0.4rem; border-radius: 4px; color: #fbbf24; font-size: 0.875rem; }
        .links { margin-top: 1.5rem; display: flex; gap: 1rem; flex-wrap: wrap; }
        a { color: #60a5fa; text-decoration: none; padding: 0.5rem 1rem; border: 1px solid #334155; border-radius: 6px; font-size: 0.875rem; transition: all 0.2s; }
        a:hover { background: #334155; }
    </style>
</head>
<body>
    <div class="card">
        <h1>wxnote 服务运行中</h1>
        <p>个人备忘录小程序后端 (Cloudflare Pages Functions + D1)</p>
        <p>API 基础路径：<code>/api</code></p>
        <p>管理后台：<code>/admin</code></p>
        <div class="links">
            <a href="/admin/">管理后台入口</a>
        </div>
    </div>
</body>
</html>
