name = "wxnote"
compatibility_date = "2024-09-23"
pages_build_output_dir = "public"

# 环境变量（敏感信息建议用 Pages Dashboard 的 Secret 设置）
[vars]
WX_APPID = "wxe8a901c5f3d32ff0"
ADMIN_DEFAULT_PASSWORD = "wjl403224736"
RESET_DEFAULT_PASSWORD = "12345678"

# D1 数据库绑定说明（不在 wrangler.toml 里配置，避免 database_id 硬编码）：
#
# 生产环境（Cloudflare Pages）：
#   Dashboard → 你的 Pages 项目 → Settings → Functions → D1 database bindings
#   Variable name: DB
#   D1 database: 选择你创建的 wxnote 数据库
#
# 本地开发：
#   npm run dev  (已在 package.json 中通过 --d1 DB=wxnote 绑定本地 D1)
#
# 微信 secret（敏感信息，用 Secret 设置）：
#   Dashboard → Pages 项目 → Settings → Environment variables → Add (Type: Secret)
#   Name: WX_SECRET
