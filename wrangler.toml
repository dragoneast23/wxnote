name = "wxnote"
compatibility_date = "2024-09-23"
pages_build_output_dir = "public"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "wxnote"
database_id = "0b4a26c9-dcb9-4b1c-9264-233a7793aabf"

# 环境变量和 Secret 全部通过 Pages Dashboard 设置：
#
# Dashboard → Pages 项目 → Settings → Environment variables → Add
#
# 需要添加的变量（Production 和 Preview 都要加）：
#   WX_APPID                  = 你的微信小程序 appid
#   WX_SECRET                 = 你的微信小程序 secret  (Type: Secret)
#   ADMIN_DEFAULT_PASSWORD    = 管理员默认密码
#   RESET_DEFAULT_PASSWORD    = 用户密码重置后的默认密码
