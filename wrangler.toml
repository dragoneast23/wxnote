name = "wxnote"
compatibility_date = "2024-09-23"
pages_build_output_dir = "public"

# D1 数据库绑定
# 注意：database_id 需要在你创建 D1 数据库后填入
# 创建命令：npx wrangler d1 create wxnote
[[d1_databases]]
binding = "DB"
database_name = "wxnote"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# 环境变量（敏感信息建议用 wrangler secret put 设置，不要写死在这里）
[vars]
WX_APPID = "wxe8a901c5f3d32ff0"
# WX_SECRET 用 secret 设置：npx wrangler pages secret put WX_SECRET
ADMIN_DEFAULT_PASSWORD = "wjl403224736"
RESET_DEFAULT_PASSWORD = "12345678"
