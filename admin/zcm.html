<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册码管理系统 - wxnote</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        secondary: '#0FC6C2',
                        dark: '#1D2939',
                        light: '#F9FAFB',
                        accent: '#7B61FF'
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .bg-glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
            .hover-lift { transition: transform 0.3s ease, box-shadow 0.3s ease; }
            .hover-lift:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(22,93,255,0.2); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-dark to-gray-800 text-light min-h-screen">
    <div id="app" class="container mx-auto px-4 py-6 sm:py-8 max-w-6xl"></div>

    <!-- 通知 -->
    <div id="notification" class="fixed bottom-5 right-5 px-4 py-3 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-50 hidden"></div>

    <script>
        const API = '/api/admin';
        const app = document.getElementById('app');

        function showNotification(message, type = 'info') {
            const n = document.getElementById('notification');
            n.textContent = message;
            n.className = 'fixed bottom-5 right-5 px-4 py-3 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-50';
            if (type === 'success') n.classList.add('bg-green-500/90','text-white');
            else if (type === 'error') n.classList.add('bg-red-500/90','text-white');
            else n.classList.add('bg-blue-500/90','text-white');
            n.classList.remove('hidden');
            setTimeout(() => n.classList.remove('translate-y-20','opacity-0'), 10);
            setTimeout(() => {
                n.classList.add('translate-y-20','opacity-0');
                setTimeout(() => n.classList.add('hidden'), 300);
            }, 3000);
        }

        async function api(path, options = {}) {
            const opts = { credentials: 'same-origin', headers: {}, ...options };
            if (opts.body && typeof opts.body === 'object') {
                opts.headers['Content-Type'] = 'application/json';
                opts.body = JSON.stringify(opts.body);
            }
            const r = await fetch(API + path, opts);
            const data = await r.json().catch(() => ({ code: -1, msg: '响应解析失败' }));
            return data;
        }

        async function checkLogin() {
            const data = await api('/users');
            return data.code === 0;
        }

        async function logout() {
            await api('/logout', { method: 'POST' });
            renderLogin();
        }

        // ============= 登录视图 =============
        function renderLogin(msg = '') {
            app.innerHTML = `
                <div class="flex items-center justify-center min-h-[80vh]">
                    <div class="bg-glass rounded-2xl p-8 border border-gray-700/30 shadow-xl w-full max-w-md">
                        <div class="text-center mb-6">
                            <a href="index.html" class="text-sm text-gray-400 hover:text-primary"><i class="fa fa-arrow-left"></i> 返回</a>
                            <h1 class="text-2xl font-bold text-primary mt-2 mb-2"><i class="fa fa-database mr-2"></i>注册码管理系统</h1>
                            <p class="text-gray-400">请登录以继续</p>
                        </div>
                        ${msg ? `<div class="bg-red-500/20 border border-red-500/40 text-red-400 px-4 py-3 rounded-lg mb-4 text-sm">${msg}</div>` : ''}
                        <form id="loginForm">
                            <div class="mb-4">
                                <label class="block text-sm font-medium text-gray-300 mb-1">用户名</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500"><i class="fa fa-user"></i></span>
                                    <input type="text" name="username" required class="w-full pl-10 pr-4 py-2 bg-gray-800 border border-gray-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary" placeholder="请输入用户名">
                                </div>
                            </div>
                            <div class="mb-6">
                                <label class="block text-sm font-medium text-gray-300 mb-1">密码</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500"><i class="fa fa-lock"></i></span>
                                    <input type="password" name="password" required class="w-full pl-10 pr-4 py-2 bg-gray-800 border border-gray-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary" placeholder="请输入密码">
                                </div>
                            </div>
                            <button type="submit" class="w-full bg-primary hover:bg-primary/90 text-white font-medium px-4 py-3 rounded-lg transition-all flex items-center justify-center">
                                <i class="fa fa-sign-in mr-2"></i>登录
                            </button>
                        </form>
                    </div>
                </div>
            `;
            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                const data = await api('/login', {
                    method: 'POST',
                    body: { username: fd.get('username'), password: fd.get('password') }
                });
                if (data.code === 0) {
                    showNotification('登录成功', 'success');
                    renderMain(fd.get('username'));
                } else {
                    renderLogin(data.msg || '登录失败');
                }
            });
        }

        // ============= 主视图 =============
        async function renderMain(username) {
            app.innerHTML = `
                <header class="mb-8">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div>
                            <h1 class="text-3xl font-bold text-primary mb-1"><i class="fa fa-database mr-2"></i>注册码管理系统</h1>
                            <p class="text-gray-400 text-sm">高效管理 registers 表中的注册码记录</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="text-sm text-gray-300">登录用户: <span class="font-medium text-primary">${username}</span></span>
                            <button id="changePwdBtn" class="bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg text-sm hover-lift"><i class="fa fa-key mr-1"></i>修改密码</button>
                            <button id="logoutBtn" class="bg-red-600 hover:bg-red-500 px-3 py-1.5 rounded-lg text-sm hover-lift"><i class="fa fa-sign-out mr-1"></i>退出</button>
                        </div>
                    </div>
                </header>

                <div class="bg-glass rounded-xl p-6 mb-8 border border-gray-700/30">
                    <h2 class="text-xl font-semibold mb-4"><i class="fa fa-plus-circle text-secondary mr-2"></i>添加新注册码</h2>
                    <form id="addForm" class="flex flex-col sm:flex-row gap-4">
                        <div class="flex-1">
                            <label class="block text-sm text-gray-300 mb-1">生成数量 (1-100)</label>
                            <input type="number" name="count" min="1" max="100" value="10" class="w-full px-4 py-2 bg-gray-800 border border-gray-700 rounded-lg focus:ring-2 focus:ring-primary">
                        </div>
                        <div class="flex items-end">
                            <button type="submit" class="bg-primary hover:bg-primary/90 text-white font-medium px-5 py-2 rounded-lg hover-lift"><i class="fa fa-magic mr-2"></i>生成并添加</button>
                        </div>
                    </form>
                </div>

                <div class="bg-glass rounded-xl p-6 border border-gray-700/30">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-3">
                        <h2 class="text-xl font-semibold"><i class="fa fa-list-alt text-secondary mr-2"></i>注册码列表 <span id="totalCount" class="ml-2 text-sm font-normal text-gray-400"></span></h2>
                        <div id="batchActions" class="flex gap-2 hidden">
                            <button id="batchCopyBtn" class="bg-green-600 hover:bg-green-500 px-3 py-1.5 rounded-lg text-sm hover-lift"><i class="fa fa-copy mr-1"></i>复制所选</button>
                            <button id="batchDeleteBtn" class="bg-red-600 hover:bg-red-500 px-3 py-1.5 rounded-lg text-sm hover-lift"><i class="fa fa-trash-o mr-1"></i>批量删除</button>
                        </div>
                    </div>
                    <div id="listContainer"></div>
                </div>

                <!-- 修改密码模态框 -->
                <div id="pwdModal" class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50 hidden">
                    <div class="bg-glass rounded-xl p-6 border border-gray-700/30 shadow-lg w-full max-w-md">
                        <h3 class="text-xl font-semibold mb-4"><i class="fa fa-key text-secondary mr-2"></i>修改密码</h3>
                        <form id="pwdForm">
                            <div class="mb-4">
                                <label class="block text-sm text-gray-300 mb-1">当前密码</label>
                                <input type="password" name="current_password" required class="w-full px-4 py-2 bg-gray-800 border border-gray-700 rounded-lg focus:ring-2 focus:ring-primary">
                            </div>
                            <div class="mb-4">
                                <label class="block text-sm text-gray-300 mb-1">新密码 (至少8位)</label>
                                <input type="password" name="new_password" minlength="8" required class="w-full px-4 py-2 bg-gray-800 border border-gray-700 rounded-lg focus:ring-2 focus:ring-primary">
                            </div>
                            <div class="mb-6">
                                <label class="block text-sm text-gray-300 mb-1">确认新密码</label>
                                <input type="password" name="confirm_password" minlength="8" required class="w-full px-4 py-2 bg-gray-800 border border-gray-700 rounded-lg focus:ring-2 focus:ring-primary">
                            </div>
                            <div class="flex gap-3">
                                <button type="button" id="cancelPwdBtn" class="flex-1 bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-lg">取消</button>
                                <button type="submit" class="flex-1 bg-primary hover:bg-primary/90 text-white px-4 py-2 rounded-lg">保存修改</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;

            document.getElementById('logoutBtn').addEventListener('click', logout);
            document.getElementById('changePwdBtn').addEventListener('click', () => {
                document.getElementById('pwdModal').classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            });
            document.getElementById('cancelPwdBtn').addEventListener('click', () => {
                document.getElementById('pwdModal').classList.add('hidden');
                document.body.style.overflow = '';
            });
            document.getElementById('pwdForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                const data = await api('/change-password', {
                    method: 'POST',
                    body: {
                        current_password: fd.get('current_password'),
                        new_password: fd.get('new_password'),
                        confirm_password: fd.get('confirm_password')
                    }
                });
                if (data.code === 0) {
                    showNotification(data.msg, 'success');
                    setTimeout(() => renderLogin('请使用新密码重新登录'), 1500);
                } else {
                    showNotification(data.msg || '修改失败', 'error');
                }
            });

            document.getElementById('addForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                const data = await api('/registers', {
                    method: 'POST',
                    body: { count: parseInt(fd.get('count'), 10) }
                });
                if (data.code === 0) {
                    showNotification(`成功生成 ${data.data.count} 条注册码`, 'success');
                    loadList();
                } else {
                    showNotification(data.msg || '生成失败', 'error');
                }
            });

            document.getElementById('batchDeleteBtn').addEventListener('click', async () => {
                const checked = Array.from(document.querySelectorAll('.code-checkbox:checked')).map(cb => cb.value);
                if (checked.length === 0) return;
                if (!confirm(`确定要删除选中的 ${checked.length} 条记录吗？`)) return;
                const data = await api('/registers', { method: 'DELETE', body: { codes: checked } });
                if (data.code === 0) {
                    showNotification('批量删除成功', 'success');
                    loadList();
                } else {
                    showNotification(data.msg || '删除失败', 'error');
                }
            });

            document.getElementById('batchCopyBtn').addEventListener('click', () => {
                const checked = Array.from(document.querySelectorAll('.code-checkbox:checked')).map(cb => cb.value);
                if (checked.length === 0) return;
                navigator.clipboard.writeText(checked.join('\n')).then(() => {
                    showNotification(`已复制 ${checked.length} 条到剪贴板`, 'success');
                }).catch(() => showNotification('复制失败', 'error'));
            });

            loadList();
        }

        async function loadList() {
            const container = document.getElementById('listContainer');
            const data = await api('/registers');
            if (data.code !== 0) {
                container.innerHTML = `<div class="text-center py-12 text-red-400">${data.msg}</div>`;
                return;
            }
            const codes = data.data || [];
            document.getElementById('totalCount').textContent = `(共 ${codes.length} 条记录)`;

            if (codes.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-gray-400">
                        <i class="fa fa-inbox text-5xl mb-3 opacity-50"></i>
                        <p>暂无注册码记录</p>
                    </div>`;
                document.getElementById('batchActions').classList.add('hidden');
                return;
            }

            let rows = codes.map(code => `
                <tr class="hover:bg-gray-800/50 transition-colors">
                    <td class="px-3 py-3 whitespace-nowrap">
                        <input type="checkbox" class="code-checkbox rounded w-4 h-4 border-gray-600 text-primary focus:ring-primary" value="${escapeHtml(code)}">
                    </td>
                    <td class="px-3 py-3 whitespace-nowrap font-mono text-sm break-all">${escapeHtml(code)}</td>
                    <td class="px-3 py-3 whitespace-nowrap text-right text-sm">
                        <button class="copy-btn text-green-400 hover:text-green-300 p-1" data-code="${escapeHtml(code)}"><i class="fa fa-copy"></i> 复制</button>
                        <button class="delete-btn text-red-400 hover:text-red-300 p-1 mr-3" data-code="${escapeHtml(code)}"><i class="fa fa-trash-o"></i> 删除</button>
                    </td>
                </tr>
            `).join('');

            container.innerHTML = `
                <div class="overflow-x-auto">
                    <table class="w-full min-w-full divide-y divide-gray-700">
                        <thead>
                            <tr>
                                <th class="px-3 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider w-12">
                                    <div class="flex items-center">
                                        <input type="checkbox" id="selectAll" class="rounded border-gray-600 w-4 h-4 text-primary focus:ring-primary">
                                        <label class="ml-2 cursor-pointer">全选</label>
                                    </div>
                                </th>
                                <th class="px-3 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">注册码</th>
                                <th class="px-3 py-3 text-right text-xs font-medium text-gray-400 uppercase tracking-wider">操作</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-800">${rows}</tbody>
                    </table>
                </div>
            `;

            // 全选
            document.getElementById('selectAll').addEventListener('change', (e) => {
                document.querySelectorAll('.code-checkbox').forEach(cb => cb.checked = e.target.checked);
                updateBatchActions();
            });
            document.querySelectorAll('.code-checkbox').forEach(cb => {
                cb.addEventListener('change', () => {
                    const all = Array.from(document.querySelectorAll('.code-checkbox')).every(c => c.checked);
                    document.getElementById('selectAll').checked = all;
                    updateBatchActions();
                });
            });
            // 单个复制
            document.querySelectorAll('.copy-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    navigator.clipboard.writeText(btn.dataset.code).then(() => {
                        showNotification(`已复制: ${btn.dataset.code}`, 'success');
                    }).catch(() => showNotification('复制失败', 'error'));
                });
            });
            // 单个删除
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    if (!confirm(`确定要删除记录 "${btn.dataset.code}" 吗？`)) return;
                    const data = await api('/registers?code=' + encodeURIComponent(btn.dataset.code), { method: 'DELETE' });
                    if (data.code === 0) {
                        showNotification('删除成功', 'success');
                        loadList();
                    } else {
                        showNotification(data.msg || '删除失败', 'error');
                    }
                });
            });
            updateBatchActions();
        }

        function updateBatchActions() {
            const count = document.querySelectorAll('.code-checkbox:checked').length;
            document.getElementById('batchActions').classList.toggle('hidden', count === 0);
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        // 启动
        (async () => {
            const loggedIn = await checkLogin();
            if (loggedIn) {
                // 取用户名（从 cookie 拿不到，重新登录页或直接进入主视图）
                renderMain('管理员');
            } else {
                renderLogin();
            }
        })();
    </script>
</body>
</html>
